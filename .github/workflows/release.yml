name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build DDrive.exe
        shell: pwsh
        run: packaging\build_exe.ps1
      - name: Check it starts
        run: |
          dist\DDrive.exe --help
          dist\DDriveLite.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DDrive.exe
            dist/DDriveLite.exe

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          python3 -m pip install cryptography
          python3 -m unittest discover -s tests
      - name: Build the .deb
        run: bash packaging/build_deb.sh
      - name: Check it installs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          ddrive --help
          ddrive-lite --help
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  # DDrive Lite for Android. The key it is signed with is not in the repository: it comes from the
  # repository's secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD). Without them no APK is made.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and sign the app
        working-directory: android
        env:
          DDRIVE_PYTHON: python
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DDRIVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python -m pip install cryptography
          mkdir -p ../dist
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in this repository's secrets: the release has no Android app."
            ./gradlew --console=plain :core:test :app:assembleDebug
            exit 0
          fi
          # Pasted secrets often carry a line break or spaces: neither belongs to the key or its password.
          export DDRIVE_KEYSTORE_PASSWORD="$(printf '%s' "$DDRIVE_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ddrive-lite.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (make it with: base64 -w0 ddrive-lite.jks)"
            exit 1
          fi
          export DDRIVE_KEYSTORE="$RUNNER_TEMP/ddrive-lite.jks"
          # Check the key before building, and say what is wrong in words (build logs need admin rights to read).
          if ! keytool -list -keystore "$DDRIVE_KEYSTORE" -storepass "$DDRIVE_KEYSTORE_PASSWORD" -alias ddrive-lite > "$RUNNER_TEMP/key.txt" 2>&1; then
            echo "::error::The keystore can't be opened with ANDROID_KEYSTORE_PASSWORD, or has no key named ddrive-lite: $(tr '\n' ' ' < "$RUNNER_TEMP/key.txt" | head -c 400)"
            rm -f "$DDRIVE_KEYSTORE"
            exit 1
          fi
          echo "::notice::Signing with the certificate whose SHA-256 is $(keytool -list -v -keystore "$DDRIVE_KEYSTORE" -storepass "$DDRIVE_KEYSTORE_PASSWORD" -alias ddrive-lite 2>/dev/null | sed -n 's/.*SHA256: *//p' | head -1)"
          if ! ./gradlew --console=plain :core:test :app:assembleRelease > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::error::The app didn't build:%0A$(grep -v -i password "$RUNNER_TEMP/build.log" | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            rm -f "$DDRIVE_KEYSTORE"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../dist/DDrive.apk
          rm -f "$DDRIVE_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: ignore

  release:
    # The Windows and Debian downloads go out even when the Android app can't be built.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows-exe.result == 'success' && needs.deb.result == 'success' }}
    needs: [windows-exe, deb, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run again for a tag that already has its release (e.g. once the signing secrets are added):
          # its files are replaced and anything missing (the Android app) is added.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DDrive $GITHUB_REF_NAME" \
            --notes "Windows: DDrive.exe (also install WinFsp from https://winfsp.dev/rel/). Debian / Ubuntu / Raspberry Pi OS: sudo apt install ./ddrive_*.deb. Lite (uses a drive that runs on another computer): DDriveLite.exe, or sudo apt install ./ddrive-lite_*.deb. Android phones: DDrive.apk (your DDrive as an app, and backing up the phone's folders to it)"
