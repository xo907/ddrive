name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the encryption library (Linux; Windows uses its built-in AES)
        if: runner.os == 'Linux'
        run: python -m pip install cryptography
      - name: Compile
        run: python -m compileall -q discorddrive tests
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Say which tests failed (shown on the run's summary page)
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          esc = lambda t: t.replace("%", "%25").replace("", "").replace("
", "%0A")
          blocks = re.split(r"
={70}
", text)[1:]
          for b in blocks[:9]:
              print("::error title=" + b.split("
", 1)[0][:120] + "::" + esc(b[-1800:]))
          if not blocks:
              print("::error title=The tests stopped::" + esc(text[-1800:]))
          EOF
