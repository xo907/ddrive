<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>FindX · DDrive</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/findx/findx-dash.css">
<link rel="stylesheet" href="/findx/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/findx/findx.css">
</head>
<body>
<div id="map"></div>

<div id="top">
  <button id="back" class="glass" hidden title="Back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z"/></svg></button>
  <div id="who" class="glass">
    <div id="avatar">·</div>
    <div class="t">
      <div id="name">FindX</div>
      <div id="fresh"><span class="dot" id="dot"></span><span id="freshText">Looking…</span></div>
    </div>
    <div id="bat" hidden></div>
  </div>
  <div id="tools" class="glass">
    <button id="follow" class="on" title="Follow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,2L4.5,20.29l0.71,0.71L12,18l6.79,3 0.71,-0.71z"/></svg></button>
    <button id="tilt" title="3D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
  </div>
</div>
<div id="picker" class="glass"></div>
<div id="toast" class="glass"></div>

<div id="sheet" class="glass">
  <div id="grab"></div>
  <div id="place">Finding…</div>
  <div id="detail"></div>
  <div id="acc" class="hidden"></div>
  <div class="actions hidden" id="actions">
    <button data-act="ring"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/></svg>Ring</button>
    <button data-act="locate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>Pin down</button>
    <button data-act="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>Live</button>
    <button data-act="lost"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.4,6L14,4H5v17h2v-7h5.6l0.4,2h7V6z"/></svg>Lost</button>
  </div>
  <div class="when" id="when">
    <button data-span="now" class="on">Now</button>
    <button data-span="today">Today</button>
    <button data-span="yesterday">Yesterday</button>
    <button data-span="week">7 days</button>
    <button data-span="month">30 days</button>
  </div>
  <div id="scrub">
    <input type="range" id="slider" min="0" max="1000" value="1000">
    <div class="lab"><span id="from"></span><b id="at"></b><span id="to"></span></div>
  </div>
  <div id="credit">Map © <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
</div>

<div id="empty"><div class="card glass"><h2 id="emptyTitle">No position yet</h2><p id="emptyText">Your devices show here once FindX on them is linked to this DDrive.</p></div></div>

<script src="/vaultcore.js"></script>
<script src="/e2e-api.js"></script>
<script src="/findx/vendor/maplibre-gl.js"></script>
<script src="/findx/findx-core.js"></script>
<script src="/findx/findx-style.js"></script>
<script src="/findx/findx-dashboard.js"></script>
<script src="/findx/findx-map.js"></script>
</body>
</html>
