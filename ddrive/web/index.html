<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>DDrive</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#0f0f10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DDrive">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="nav-toggle" type="button" aria-label="Shrink the menu to icons" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.500"/><path d="M8 4v12"/></svg>
    </button>
    <a class="brand" href="#/home">
      <img src="/logo.svg" alt="" width="22" height="22">
      <span>DDrive</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="q" type="search" placeholder="Search files" autocomplete="off" spellcheck="false" aria-label="Search files">
    </label>
    <a class="sync" id="sync" href="#/health" title="Drive status">
      <span class="dot" id="sync-dot"></span><span id="sync-text">Connecting</span>
    </a>
    <button class="icon-btn lock-btn" id="locks" aria-label="Locked folders" aria-haspopup="menu" title="Locked folders" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>
    </button>
    <button class="avatar" id="account" aria-label="Account" aria-haspopup="menu"></button>
  </header>

  <nav class="side" id="nav" aria-label="Sections">
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 9.5 10 4l6.5 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-4V17H4.500a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/files/" data-nav="files">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.6 1.8H16a1.5 1.5 0 0 1 1.5 1.5v7.7A1.5 1.5 0 0 1 16 16.5H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
      <span>Files</span>
    </a>
    <a href="#/gallery/" data-nav="gallery">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="14" height="13" rx="1.5"/><circle cx="7.5" cy="8" r="1.3"/><path d="m3.5 14 4-3.5 3 2.5 2.5-2 3.5 3"/></svg>
      <span>Gallery</span>
    </a>
    <a href="#/starred" data-nav="starred">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3 2.1 4.4 4.8.6-3.5 3.3.9 4.8L10 13.8 5.7 16.1l.9-4.8L3.1 8l4.8-.6z"/></svg>
      <span>Starred</span>
    </a>
    <button class="nav-head" type="button" data-group="tools" aria-expanded="true"><span>Tools</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.500 10l5.500 5.500"/></svg></button>
    <div class="nav-group">
    <a href="#/notes" data-nav="notes">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z"/><path d="M7 7h6M7 10h6M7 13h3.5"/></svg>
      <span>Notes</span>
    </a>
    <a href="#/bookmarks" data-nav="bookmarks">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 3.5h9a1 1 0 0 1 1 1v12.5L10 13.5 4.500 17V4.500a1 1 0 0 1 1-1z"/></svg>
      <span>Bookmarks</span>
    </a>
    <a href="#/messages" data-nav="messages">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h12a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1H8l-4 3V5.500a1 1 0 0 1 1-1z"/></svg>
      <span>Messages</span>
    </a>
    <a href="#/contacts" data-nav="contacts">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7.5" r="3"/><path d="M4.5 16.5a5.5 5.5 0 0 1 11 0"/></svg>
      <span>Contacts</span>
    </a>
    </div>
    <button class="nav-head" type="button" data-group="share" aria-expanded="true"><span>Share and sync</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.500 10l5.500 5.500"/></svg></button>
    <div class="nav-group">
    <a href="#/shared" data-nav="shared">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.4-2.4a3 3 0 0 0-4.2-4.2l-.9.9"/><path d="M11.5 8.5a3 3 0 0 0-4.2 0l-2.4 2.4a3 3 0 0 0 4.2 4.2l.9-.9"/></svg>
      <span>Shared</span>
    </a>
    <a href="#/sync" data-nav="sync">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 8A6 6 0 0 0 4.7 6.2M4.5 12a6 6 0 0 0 10.8 1.8"/><path d="M15.8 3.8V8h-4.2M4.2 16.2V12h4.2"/></svg>
      <span>Sync</span>
    </a>
    </div>
    <button class="nav-head" type="button" data-group="history" aria-expanded="true"><span>History</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.500 10l5.500 5.500"/></svg></button>
    <div class="nav-group">
    <a href="#/history" data-nav="history">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10h3l2-5 3.5 10 2-5h4.5"/></svg>
      <span>Activity</span>
    </a>
    <a href="#/deleted" data-nav="deleted">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4.5h4V6M5.5 6l.7 9.6a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9L14.5 6"/></svg>
      <span>Deleted</span>
    </a>
    <a href="#/snapshots" data-nav="snapshots">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.6"/></svg>
      <span>Snapshots</span>
    </a>
    </div>
    <button class="nav-head" type="button" data-group="drive" aria-expanded="true"><span>Drive</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.500 10l5.500 5.500"/></svg></button>
    <div class="nav-group">
    <a href="#/storage" data-nav="storage">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5a6.5 6.5 0 1 0 6.5 6.5H10z"/><path d="M12.5 3a5 5 0 0 1 4.5 4.5h-4.5z"/></svg>
      <span>Storage</span>
    </a>
    <a href="#/log" data-nav="log">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7"/><circle cx="15.5" cy="15" r="1.5"/></svg>
      <span>Log</span>
    </a>
    <a href="#/health" data-nav="health">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8 4 5v4.6c0 3.4 2.5 6.2 6 7.6 3.5-1.4 6-4.2 6-7.6V5z"/><path d="m7.4 10 1.8 1.8 3.6-3.6"/></svg>
      <span>Health</span>
    </a>
    <a href="#/resources" data-nav="resources">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.500" y="5.500" width="9" height="9" rx="1.500"/><path d="M8 2.500v3M12 2.500v3M8 14.500v3M12 14.500v3M2.500 8h3M2.500 12h3M14.500 8h3M14.500 12h3"/></svg>
      <span>Resources</span>
    </a>
    </div>
    <div class="usage" id="usage"></div>
  </nav>

  <main id="main" tabindex="-1"></main>
</div>

<aside class="sheet" id="sheet" aria-hidden="true">
  <header class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button class="icon-btn" id="sheet-close" aria-label="Close">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</aside>
<div class="scrim" id="scrim"></div>

<dialog id="dialog">
  <form method="dialog" id="dialog-form">
    <h3 id="dialog-title"></h3>
    <p id="dialog-text"></p>
    <input id="dialog-input" autocomplete="off" spellcheck="false">
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost" type="submit">Cancel</button>
      <button value="ok" class="btn" id="dialog-ok" type="submit">OK</button>
    </div>
  </form>
</dialog>

<div class="tray" id="tray" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop"><div>Drop to upload into <b id="drop-to"></b></div></div>
<input type="file" id="pick" multiple hidden>
<input type="file" id="pick-dir" multiple webkitdirectory hidden>
<input type="file" id="pick-contacts" multiple accept=".vcf,.vcard,.csv,text/vcard,text/x-vcard,text/csv" hidden>
<script src="/vaultcore.js"></script>
<script src="/e2e-api.js"></script>
<script src="/app.js"></script>
<script src="/moving.js"></script>
</body>
</html>
