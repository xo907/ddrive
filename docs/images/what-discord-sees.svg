<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Left: the folders and files you see on the drive. Right: what Discord stores, only random names and encrypted data">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c83fd"/>
    </marker>
    <g id="folder"><path d="M0 3 a2 2 0 0 1 2 -2 h5 l2 2 h7 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 z" fill="#d29922"/></g>
    <g id="file"><path d="M0 0 h9 l4 4 v12 h-13 z" fill="none" stroke="#8b949e" stroke-width="1.4"/></g>
  </defs>
  <rect width="960" height="430" rx="16" fill="#0d1117"/>

  <!-- left: your drive -->
  <rect x="30" y="30" width="400" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="62" fill="#e6edf3" font-size="16" font-weight="700">What you see</text>
  <text x="168" y="62" fill="#8b949e" font-size="13">Z:\ or /mnt/ddrive</text>
  <line x1="30" y1="76" x2="430" y2="76" stroke="#30363d"/>
  <g font-size="13.5" fill="#c9d1d9">
    <use href="#folder" x="50" y="92"/><text x="76" y="105">Music</text>
    <use href="#folder" x="74" y="118"/><text x="100" y="131">Artist - Album (2024)</text>
    <use href="#file" x="100" y="143"/><text x="122" y="156">01 - Opening.flac</text><text x="410" y="156" fill="#8b949e" text-anchor="end">38.2 MB</text>
    <use href="#file" x="100" y="168"/><text x="122" y="181">02 - Daybreak.flac</text><text x="410" y="181" fill="#8b949e" text-anchor="end">41.7 MB</text>
    <use href="#folder" x="50" y="196"/><text x="76" y="209">Photos</text>
    <use href="#file" x="76" y="221"/><text x="98" y="234">2025-07-14 beach.jpg</text><text x="410" y="234" fill="#8b949e" text-anchor="end">4.1 MB</text>
    <use href="#folder" x="50" y="249"/><text x="76" y="262">Documents</text>
    <use href="#file" x="76" y="274"/><text x="98" y="287">tax-return-2025.pdf</text><text x="410" y="287" fill="#8b949e" text-anchor="end">1.2 MB</text>
    <use href="#file" x="76" y="299"/><text x="98" y="312">passport-scan.png</text><text x="410" y="312" fill="#8b949e" text-anchor="end">2.6 MB</text>
    <use href="#folder" x="50" y="327"/><text x="76" y="340">Videos</text>
  </g>

  <!-- middle -->
  <path d="M440 200 L516 200" stroke="#7c83fd" stroke-width="2.5" fill="none" marker-end="url(#arr2)"/>
  <rect x="465" y="160" width="26" height="20" rx="3" fill="#7c83fd"/>
  <path d="M470 160 v-6 a8 8 0 0 1 16 0 v6" stroke="#7c83fd" stroke-width="2.5" fill="none"/>
  <text x="478" y="224" fill="#8b949e" font-size="11" text-anchor="middle">AES-256-GCM</text>

  <!-- right: discord -->
  <rect x="530" y="30" width="400" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="62" fill="#e6edf3" font-size="16" font-weight="700">What Discord sees</text>
  <text x="706" y="62" fill="#8b949e" font-size="13"># drive (private channel)</text>
  <line x1="530" y1="76" x2="930" y2="76" stroke="#30363d"/>
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.5">
    <rect x="548" y="90" width="364" height="36" rx="6" fill="#1c2129"/>
    <use href="#file" x="560" y="100"/><text x="582" y="113" fill="#9ea8ff">chk_3f9a12c07be1d4e1.bin</text>
    <text x="900" y="113" fill="#8b949e" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">9.00 MB</text>

    <rect x="548" y="132" width="364" height="36" rx="6" fill="#1c2129"/>
    <use href="#file" x="560" y="142"/><text x="582" y="155" fill="#9ea8ff">chk_b72c55e0a91f3c04.bin</text>
    <text x="900" y="155" fill="#8b949e" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">9.00 MB</text>

    <rect x="548" y="174" width="364" height="36" rx="6" fill="#1c2129"/>
    <use href="#file" x="560" y="184"/><text x="582" y="197" fill="#9ea8ff">chk_e45f0b7d2c81a9f6.bin</text>
    <text x="900" y="197" fill="#8b949e" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">9.00 MB</text>

    <rect x="548" y="216" width="364" height="36" rx="6" fill="#1c2129"/>
    <text x="560" y="239" fill="#c9d1d9">DDOP1 REVOQ8kz3Rw1p+Qx7vT0nLm2s9Hc…</text>

    <rect x="548" y="258" width="364" height="36" rx="6" fill="#1c2129"/>
    <use href="#file" x="560" y="268"/><text x="582" y="281" fill="#9ea8ff">chk_0d8e4a7f2b6c9e13.bin</text>
    <text x="900" y="281" fill="#8b949e" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">4.27 MB</text>

    <rect x="548" y="300" width="364" height="52" rx="6" fill="#1c2129" stroke="#d29922" stroke-opacity="0.6"/>
    <text x="560" y="320" fill="#d29922" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700">PINNED</text>
    <text x="612" y="320" fill="#c9d1d9" font-size="11.5">DDRIVE_INDEX ENC_V3 …</text>
    <use href="#file" x="560" y="327"/><text x="582" y="340" fill="#9ea8ff">idx_51c2e8a90f3b77d4.bin</text>
  </g>

  <text x="480" y="402" fill="#8b949e" font-size="13.5" text-anchor="middle">No file names, folders or contents leave your computer: only random names, sizes and encrypted bytes.</text>
</svg>
