[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddrive"
dynamic = ["version"]
description = "An encrypted virtual drive (Windows / Linux) backed by a private Discord channel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "cryptography; sys_platform != 'win32'",
]

[project.scripts]
ddrive = "ddrive.cli:main"

[tool.setuptools]
packages = ["ddrive", "ddrive._vendor"]

[tool.setuptools.package-data]
ddrive = ["web/*", "scripts/linux/*", "scripts/windows/*", "wordlist.txt"]

[tool.setuptools.dynamic]
version = { attr = "ddrive.__version__" }
